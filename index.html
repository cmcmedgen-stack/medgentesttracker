<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inpatient Exome Test Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-slate-800">🧪 Inpatient Exome Test Tracker</h1>
      <p class="text-sm text-gray-500">Real-time status tracking for clinical exome diagnostics</p>
    </header>

    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
      <h2 class="text-xl font-semibold mb-4 text-slate-700">Register New Exome Test</h2>
      <form id="testForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Patient Name</label>
          <input type="text" id="patientName" required placeholder="e.g. John Doe" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Hosp / MRN Number</label>
          <input type="text" id="hospNumber" required placeholder="e.g. H123456" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Test Name</label>
          <input type="text" id="testName" required value="Clinical Exome Sequencing" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Testing Lab</label>
          <input type="text" id="testingLab" required placeholder="e.g. Central Genomics Lab" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Registration Date</label>
          <input type="date" id="regDate" required class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Ordering Doctor</label>
          <input type="text" id="orderingDoctor" required placeholder="e.g. Dr. Smith" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="md:col-span-3">
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded transition">
            + Add Test Record
          </button>
        </div>
      </form>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b bg-gray-100 flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-700">Active Patient Tests</h2>
        <span id="recordCount" class="text-xs bg-blue-100 text-blue-800 font-bold px-2.5 py-0.5 rounded">0 Records</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 border-b text-gray-600 uppercase text-xs">
            <tr>
              <th class="py-3 px-4">Patient Name</th>
              <th class="py-3 px-4">Hosp No.</th>
              <th class="py-3 px-4">Test</th>
              <th class="py-3 px-4">Lab</th>
              <th class="py-3 px-4">Reg. Date</th>
              <th class="py-3 px-4">Ordering Doctor</th>
              <th class="py-3 px-4">Turnaround Time</th>
              <th class="py-3 px-4 text-center">Results Received?</th>
            </tr>
          </thead>
          <tbody id="trackerTableBody" class="divide-y divide-gray-100">
            </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ⚙️ 1. REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBBXG6uPml-a8Q6Fgk5RldyQBhlSfsj-TA",
  authDomain: "ip-result-tracking.firebaseapp.com",
  databaseURL: "https://ip-result-tracking-default-rtdb.firebaseio.com",
  projectId: "ip-result-tracking",
  storageBucket: "ip-result-tracking.firebasestorage.app",
  messagingSenderId: "811691909994",
  appId: "1:811691909994:web:203d9da82de90e663fbb13"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("exome_tests");

    // Set default date picker to today
    document.getElementById("regDate").valueAsDate = new Date();

    // 📥 2. Submit New Exome Test
    document.getElementById("testForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const newTest = {
        patientName: document.getElementById("patientName").value,
        hospNumber: document.getElementById("hospNumber").value,
        testName: document.getElementById("testName").value,
        testingLab: document.getElementById("testingLab").value,
        regDate: document.getElementById("regDate").value,
        orderingDoctor: document.getElementById("orderingDoctor").value,
        resultsReceived: false,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      };

      db.push(newTest, (err) => {
        if (err) {
          alert("Error saving record: " + err.message);
        } else {
          document.getElementById("testForm").reset();
          document.getElementById("regDate").valueAsDate = new Date();
        }
      });
    });

    // 🔄 3. Render Table Real-Time with Automated Overdue Reminders
    db.on("value", (snapshot) => {
      const tableBody = document.getElementById("trackerTableBody");
      tableBody.innerHTML = "";
      
      const data = snapshot.val();
      if (!data) {
        tableBody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-gray-400">No exome tests logged yet.</td></tr>`;
        document.getElementById("recordCount").innerText = "0 Records";
        return;
      }

      const keys = Object.keys(data);
      document.getElementById("recordCount").innerText = `${keys.length} Records`;

      keys.reverse().forEach((id) => {
        const item = data[id];
        
        // Calculate Days Elapsed since Registration Date
        const regDateObj = new Date(item.regDate);
        const todayObj = new Date();
        const diffTime = todayObj - regDateObj;
        const daysElapsed = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        // 🚨 Reminder Logic: 1 Month (30 Days) + Weekly Follow-ups
        let tatBadgeHtml = "";
        let rowClass = item.resultsReceived ? "bg-green-50/50" : "hover:bg-gray-50";

        if (item.resultsReceived) {
          tatBadgeHtml = `<span class="text-xs bg-green-100 text-green-700 px-2.5 py-1 rounded-full font-semibold">✓ Completed</span>`;
        } else if (daysElapsed >= 30) {
          // Calculate how many extra weeks past the 30-day mark
          const weeksOverdue = Math.floor((daysElapsed - 30) / 7) + 1;
          
          // Highlight row in light red for urgent attention
          rowClass = "bg-red-50 hover:bg-red-100/60 transition";
          tatBadgeHtml = `
            <div class="flex flex-col items-start gap-1">
              <span class="text-xs bg-red-600 text-white px-2.5 py-0.5 rounded font-bold animate-pulse">
                ⚠️ REMINDER: Overdue (${daysElapsed} Days)
              </span>
              <span class="text-[11px] font-semibold text-red-700">
                Weekly Follow-up #${weeksOverdue} Required
              </span>
            </div>
          `;
        } else {
          tatBadgeHtml = `<span class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded font-medium">${daysElapsed} Day(s) Pending</span>`;
        }

        const row = document.createElement("tr");
        row.className = rowClass;

        row.innerHTML = `
          <td class="py-3 px-4 font-semibold text-slate-800">${escapeHtml(item.patientName)}</td>
          <td class="py-3 px-4 font-mono text-xs">${escapeHtml(item.hospNumber)}</td>
          <td class="py-3 px-4">${escapeHtml(item.testName)}</td>
          <td class="py-3 px-4">${escapeHtml(item.testingLab)}</td>
          <td class="py-3 px-4">${item.regDate}</td>
          <td class="py-3 px-4">${escapeHtml(item.orderingDoctor)}</td>
          <td class="py-3 px-4">${tatBadgeHtml}</td>
          <td class="py-3 px-4 text-center">
            <input type="checkbox" 
                   class="w-5 h-5 text-blue-600 rounded cursor-pointer accent-blue-600"
                   ${item.resultsReceived ? "checked" : ""} 
                   onchange="toggleResult('${id}', this.checked)">
          </td>
        `;
        tableBody.appendChild(row);
      });
    });

    // ✅ 4. Toggle "Results Received" Checkbox
    window.toggleResult = (id, isChecked) => {
      db.child(id).update({
        resultsReceived: isChecked
      });
    };

    // Helper function to prevent XSS attacks
    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : "";
    }
  </script>
</body>
</html>
