<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inpatient Exome Test Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        header h1 {
            color: #1a365d;
            font-size: 1.8rem;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card h2 {
            font-size: 1.2rem;
            color: #2b6cb0;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a5568;
        }

        .form-group input, 
        .form-group select {
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #3182ce;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #3182ce;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2b6cb0;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background-color: #cbd5e0;
        }

        .btn-danger {
            background-color: #e53e3e;
            color: white;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            background-color: #c53030;
        }

        .btn-edit {
            background-color: #dd6b20;
            color: white;
            padding: 6px 12px;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        .btn-edit:hover {
            background-color: #c05621;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-bar input, .filter-bar select {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        th {
            background-color: #f7fafc;
            color: #4a5568;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-collected { background-color: #feebc8; color: #744210; }
        .status-sequencing { background-color: #ebf8ff; color: #2b6cb0; }
        .status-analysis { background-color: #e9d8fd; color: #553c9a; }
        .status-completed { background-color: #c6f6d5; color: #22543d; }

        .tag-yes { color: #22543d; font-weight: bold; }
        .tag-no { color: #a0aec0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🧬 Inpatient Exome Test Tracker</h1>
    </header>

    <div class="card">
        <h2 id="formTitle">Add New Exome Test Record</h2>
        <form id="trackerForm">
            <input type="hidden" id="recordId">
            <div class="form-grid">
                <div class="form-group">
                    <label for="mrn">MRN / Patient ID</label>
                    <input type="text" id="mrn" required placeholder="e.g. PAT-10923">
                </div>
                <div class="form-group">
                    <label for="patientName">Patient Name</label>
                    <input type="text" id="patientName" required placeholder="Full Name">
                </div>
                <div class="form-group">
                    <label for="admissionDate">Admission Date</label>
                    <input type="date" id="admissionDate" required>
                </div>
                <div class="form-group">
                    <label for="sampleDate">Sample Collection Date</label>
                    <input type="date" id="sampleDate" required>
                </div>
                <div class="form-group">
                    <label for="specimenType">Specimen Type</label>
                    <select id="specimenType" required>
                        <option value="">Select Specimen</option>
                        <option value="Whole Blood">Whole Blood</option>
                        <option value="Tissue">Tissue</option>
                        <option value="Saliva">Saliva</option>
                        <option value="Extracted DNA">Extracted DNA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="orderingPhysician">Ordering Physician</label>
                    <input type="text" id="orderingPhysician" placeholder="Dr. Name">
                </div>
                <div class="form-group">
                    <label for="status">Test Status</label>
                    <select id="status" required>
                        <option value="Sample Collected">Sample Collected</option>
                        <option value="Sequencing">Sequencing</option>
                        <option value="Variant Analysis">Variant Analysis</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="extraSampleReceived">Extra Sample Received?</label>
                    <select id="extraSampleReceived">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ipCharged">IP Charged?</label>
                    <select id="ipCharged">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btnCancel" onclick="resetForm()" style="display: none;">Cancel</button>
                    <button type="submit" class="btn-primary" id="btnSubmit">Save Record</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Inpatient Test Dashboard</h2>
        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search by MRN or Name..." oninput="renderTable()">
            <select id="statusFilter" onchange="renderTable()">
                <option value="ALL">All Statuses</option>
                <option value="Sample Collected">Sample Collected</option>
                <option value="Sequencing">Sequencing</option>
                <option value="Variant Analysis">Variant Analysis</option>
                <option value="Completed">Completed</option>
            </select>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>MRN</th>
                        <th>Patient Name</th>
                        <th>Admission Date</th>
                        <th>Sample Date</th>
                        <th>Specimen</th>
                        <th>Physician</th>
                        <th>TAT (Days)</th>
                        <th>Status</th>
                        <th>Extra Sample Recv.</th>
                        <th>IP Charged</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="trackerTableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASSCODE = "1234"; // Set your preferred Admin Passcode
    let trackerData = JSON.parse(localStorage.getItem("exome_tracker_db")) || [];

    document.getElementById("trackerForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const id = document.getElementById("recordId").value;
        const record = {
            id: id ? parseInt(id) : Date.now(),
            mrn: document.getElementById("mrn").value,
            patientName: document.getElementById("patientName").value,
            admissionDate: document.getElementById("admissionDate").value,
            sampleDate: document.getElementById("sampleDate").value,
            specimenType: document.getElementById("specimenType").value,
            orderingPhysician: document.getElementById("orderingPhysician").value,
            status: document.getElementById("status").value,
            // Reading Form Data for Extra Fields
            extraSampleReceived: document.getElementById("extraSampleReceived").value,
            ipCharged: document.getElementById("ipCharged").value
        };

        if (id) {
            // Edit existing
            const index = trackerData.findIndex(item => item.id === parseInt(id));
            if (index !== -1) trackerData[index] = record;
        } else {
            // Add new
            trackerData.push(record);
        }

        saveToStorage();
        resetForm();
        renderTable();
    });

    function calculateTAT(sampleDateStr) {
        if (!sampleDateStr) return "-";
        const sampleDate = new Date(sampleDateStr);
        const today = new Date();
        const diffTime = Math.abs(today - sampleDate);
        return Math.floor(diffTime / (1000 * 60 * 60 * 24));
    }

    function renderTable() {
        const tbody = document.getElementById("trackerTableBody");
        const searchQuery = document.getElementById("searchInput").value.toLowerCase();
        const filterStatus = document.getElementById("statusFilter").value;

        tbody.innerHTML = "";

        const filtered = trackerData.filter(item => {
            const matchesSearch = item.mrn.toLowerCase().includes(searchQuery) || item.patientName.toLowerCase().includes(searchQuery);
            const matchesStatus = filterStatus === "ALL" || item.status === filterStatus;
            return matchesSearch && matchesStatus;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; color:#a0aec0;">No records found.</td></tr>`;
            return;
        }

        filtered.forEach(item => {
            let statusBadgeClass = "status-collected";
            if (item.status === "Sequencing") statusBadgeClass = "status-sequencing";
            if (item.status === "Variant Analysis") statusBadgeClass = "status-analysis";
            if (item.status === "Completed") statusBadgeClass = "status-completed";

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${item.mrn}</strong></td>
                <td>${item.patientName}</td>
                <td>${item.admissionDate}</td>
                <td>${item.sampleDate}</td>
                <td>${item.specimenType}</td>
                <td>${item.orderingPhysician || '-'}</td>
                <td>${calculateTAT(item.sampleDate)} days</td>
                <td><span class="badge ${statusBadgeClass}">${item.status}</span></td>
                <td class="${item.extraSampleReceived === 'Yes' ? 'tag-yes' : 'tag-no'}">${item.extraSampleReceived}</td>
                <td class="${item.ipCharged === 'Yes' ? 'tag-yes' : 'tag-no'}">${item.ipCharged}</td>
                <td>
                    <button class="btn-edit" onclick="editRecord(${item.id})">✏️ Edit</button>
                    <button class="btn-danger" onclick="deleteRecordWithAuth(${item.id})">🗑️ Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function editRecord(id) {
        const item = trackerData.find(rec => rec.id === id);
        if (!item) return;

        document.getElementById("recordId").value = item.id;
        document.getElementById("mrn").value = item.mrn;
        document.getElementById("patientName").value = item.patientName;
        document.getElementById("admissionDate").value = item.admissionDate;
        document.getElementById("sampleDate").value = item.sampleDate;
        document.getElementById("specimenType").value = item.specimenType;
        document.getElementById("orderingPhysician").value = item.orderingPhysician;
        document.getElementById("status").value = item.status;
        
        // Populating Form for Edit
        document.getElementById("extraSampleReceived").value = item.extraSampleReceived || "No";
        document.getElementById("ipCharged").value = item.ipCharged || "No";

        document.getElementById("formTitle").innerText = "Edit Exome Test Record";
        document.getElementById("btnSubmit").innerText = "Update Record";
        document.getElementById("btnCancel").style.display = "inline-block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Admin Passcode Deletion Authentication
    function deleteRecordWithAuth(id) {
        const passcode = prompt("Enter Admin Passcode to Delete this Record:");
        if (passcode === ADMIN_PASSCODE) {
            if (confirm("Are you sure you want to delete this record?")) {
                trackerData = trackerData.filter(item => item.id !== id);
                saveToStorage();
                renderTable();
            }
        } else if (passcode !== null) {
            alert("Incorrect Admin Passcode. Deletion cancelled.");
        }
    }

    function resetForm() {
        document.getElementById("trackerForm").reset();
        document.getElementById("recordId").value = "";
        document.getElementById("formTitle").innerText = "Add New Exome Test Record";
        document.getElementById("btnSubmit").innerText = "Save Record";
        document.getElementById("btnCancel").style.display = "none";
    }

    function saveToStorage() {
        localStorage.setItem("exome_tracker_db", JSON.stringify(trackerData));
    }

    // Initial table render on load
    renderTable();
</script>

</body>
</html>
